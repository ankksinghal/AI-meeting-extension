<!DOCTYPE html>
<html>
  <head>
    <title>
      AI Meeting Copilot
    </title>
    <link
      rel="stylesheet"
      href="popup.css"
    />
  </head>

  <body class="w-[300px] bg-white p-4 font-sans text-slate-900">
    <h2 class="mb-3 text-xl font-bold">
      AI Meeting Copilot
    </h2>

    <p
      id="status"
      class="mb-4 text-sm text-slate-600"
    >
      Checking meeting...
    </p>

    <button
      id="openDashboard"
      class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-medium text-white hover:bg-blue-700"
    >
      Open Dashboard
    </button>

    <button
      id="toggleCapture"
      class="mt-3 w-full rounded-lg bg-green-600 px-4 py-2.5 font-medium text-white hover:bg-green-700"
      disabled
    >
      Start Recording
    </button>

    <script src="pop.js"></script>
  </body>
</html>
